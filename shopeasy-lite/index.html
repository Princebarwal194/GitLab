<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ShopEasy Lite</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            background: #f4f4f4;
            text-align: center;
        }
        header {
            background: #222;
            color: white;
            padding: 20px;
        }
        .products {
            display: flex;
            justify-content: center;
            gap: 20px;
            flex-wrap: wrap;
            padding: 30px;
        }
        .product {
            background: white;
            padding: 20px;
            width: 180px;
            border-radius: 8px;
        }
        button {
            background: #087f5b;
            color: white;
            border: 0;
            padding: 10px 15px;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <header>
        <h1>ShopEasy Lite</h1>
        <p>Your simple online shopping store - Version 2</p>
    </header>

    <main class="products">
        <div class="product">
            <h2>Headphones</h2>
            <p>Price: ₹999</p>
            <button>Add to Cart</button>
        </div>
        <div class="product">
            <h2>Smart Watch</h2>
            <p>Price: ₹1,499</p>
            <button>Add to Cart</button>
        </div>
        <div class="product">
            <h2>Backpack</h2>
            <p>Price: ₹799</p>
            <button>Add to Cart</button>
        </div>
    </main>
</body>
</html>
